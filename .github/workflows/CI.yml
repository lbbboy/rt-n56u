name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with tmate debugging enabled'
        required: false
        default: 'no'

jobs:
  build:
    name: build
    runs-on: ubuntu-22.04
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
    env:
      build_variant: ${{ matrix.build_variant }}
      targets: ${{ matrix.targets }}
      images_dir: /opt/images
    strategy:
      matrix:
        include:
          - build_variant: "mt7621-usb"
            targets: "NEWIFI3"

    steps:
      - uses: actions/checkout@v2

      - name: Prepare environment
        run: |
          sudo apt update
          sudo apt install libtool-bin gperf python3-docutils autopoint gettext

      - name: Run shellcheck
        run: sh ./trunk/tools/shellcheck.sh

      - name: Prepare toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'yes' }}
        with:
          limit-access-to-actor: true

      - name: Start build
        run: |
          cd trunk
          mkdir -p ${images_dir}
          for m in $targets; do
            fakeroot ./build_firmware_ci $m
            if [ $? = 0 ]; then
              cp -f images/*.trx ${images_dir}/$m.trx
            else
              exit 1
            fi
            ./clear_tree_simple >/dev/null 2>&1
          done

      - name: Upload images to Artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: images_${{ matrix.build_variant }}_${{ github.sha }}
          path: ${{ env.images_dir }}/*.trx

  # ── 自动打 tag + 发布 Release，仅 push 到 main/master ──
  auto-release:
    name: auto release
    runs-on: ubuntu-22.04
    needs: build
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Generate tag name
        id: tag
        run: |
          DATE=$(date -u +%Y.%m.%d)
          SHA8=$(echo "${GITHUB_SHA}" | cut -c1-8)
          TAG="v${DATE}-${SHA8}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: images_mt7621-usb_${{ github.sha }}
          path: /opt/images

      - name: Create tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.tag.outputs.tag }}" -m "Auto release ${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            自动构建发布

            - 构建时间：${{ steps.tag.outputs.tag }}
            - Commit：${{ github.sha }}
            - 分支：${{ github.ref_name }}
          files: /opt/images/*.trx
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
